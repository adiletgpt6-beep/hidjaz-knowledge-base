name: Hidjaz MMS Kyrgyz batch
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "Start video index (0-based); first pilot is index 0"
        required: true
        default: "0"
        type: string
      limit:
        description: "Videos per batch (1-5)"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5"]
permissions:
  contents: read
concurrency:
  group: hidjaz-mms-batch
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local MMS dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install boto3 numpy soundfile "transformers==4.44.2" "torch>=2.2,<2.6" sentencepiece
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Transcribe batch and checkpoint each result in R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          python importer/batch_mms.py --offset "$OFFSET" --limit "$LIMIT"
      - name: Save batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidjaz-mms-batch-report
          path: asr-batch/report.json
          if-no-files-found: warn
          retention-days: 30
