name: Hidjaz Kyrgyz transcription pilot
on:
  workflow_dispatch:
    inputs:
      shortcode:
        description: "Instagram video shortcode"
        required: true
        default: "Deb9iRjtemv"
        type: string
permissions:
  contents: read
concurrency:
  group: hidjaz-asr-pilot
  cancel-in-progress: false
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local speech recognition dependencies
        run: |
          python -m pip install boto3 faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download and verify archived video, extract audio
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SHORTCODE: ${{ inputs.shortcode }}
        run: python importer/prepare_asr.py --code "$SHORTCODE"
      - name: Transcribe Kyrgyz locally (draft only)
        env:
          SHORTCODE: ${{ inputs.shortcode }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python importer/transcribe_pilot.py --code "$SHORTCODE" --model small
      - name: Save draft transcript and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidjaz-kyrgyz-transcript-pilot
          path: asr-pilot/
          if-no-files-found: warn
          retention-days: 7
