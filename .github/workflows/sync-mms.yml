name: Hidjaz sync MMS transcripts to GitHub
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hidjaz-transcript-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install boto3
      - name: Fetch and validate all MMS drafts
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python importer/sync_mms.py
      - name: Commit verified downloads as unreviewed drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transcripts/
          if git diff --cached --quiet; then
            echo "No transcript changes"
          else
            git commit -m "Sync 44 Kyrgyz MMS draft transcripts from R2"
            git push
          fi
