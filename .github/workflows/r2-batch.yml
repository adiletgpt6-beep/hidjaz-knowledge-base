name: Hidjaz R2 batch archive
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum media objects to process (1-200)"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "20"
          - "100"
          - "200"
permissions:
  contents: read
concurrency:
  group: hidjaz-r2-batch
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3 requests
      - name: Archive and independently verify media
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          python importer/bulk.py --limit "$LIMIT"
      - name: Save import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidjaz-import-report
          path: import-report.json
          if-no-files-found: warn
          retention-days: 30
